data:
    value:
        batch_size: 2
        cache_sketches: true
        coco_root: /workspace/coco
        dataset_name: sketchy
        graph_type: adjacency
        image_size: 256
        max_num_regions: 50
        min_region_area: 100
        num_workers: 8
        pin_memory: true
        preload_graphs: true
        sketch_method: canny
        sketchy_root: /workspace/sketchy
        use_augmentation: true
model:
    value:
        freeze_stage1_unet: true
        fusion_method: learned
        hidden_dim: 512
        lora_alpha: 4
        lora_rank: 4
        node_feature_dim: 6
        num_attention_heads: 8
        num_graph_layers: 2
        pretrained_model_name: runwayml/stable-diffusion-v1-5
        ragaf_dropout: 0.1
        residual_alpha: 0.2
        sketch_encoder_channels:
            - 320
            - 640
            - 1280
            - 1280
        text_dim: 768
        use_lora: true
        use_region_adaptive_fusion: true
training:
    value:
        adam_beta1: 0.9
        adam_beta2: 0.999
        adam_epsilon: 1e-08
        adam_weight_decay: 0.01
        checkpoint_dir: /workspace/checkpoints
        dataset_limit: 10000
        delta_threshold_high: 0.75
        delta_threshold_low: 0.35
        device: cuda
        early_stopping_patience: 5
